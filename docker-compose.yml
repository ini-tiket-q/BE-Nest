version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tiketq
      POSTGRES_PASSWORD: tiketq123
      POSTGRES_DB: tiketq_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '16686:16686'
      - '14268:14268'

volumes:
  postgres_data:
